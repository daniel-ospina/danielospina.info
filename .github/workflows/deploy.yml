name: Deploy

# Pushes to main publish the site. The Pages project is a direct-upload project
# (not connected to this repo), so this workflow is what publishes — see README.
#
# The credential is a Cloudflare API token scoped to Pages:Edit on this one
# account and nothing else: no DNS, no zone settings, no other product. If it
# leaked, the worst it grants is deploying other content to this same site —
# which anyone with write access could already do by pushing here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
