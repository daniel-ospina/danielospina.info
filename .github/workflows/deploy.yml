name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, mint a Pages deployment.
permissions:
  contents: read
  deployments: write

# Never let two deploys race; the newer commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages uploads everything under the publish directory, so stage only the
      # files that are actually the site. Without this, README.md, scripts/ and
      # .github/ get published at public URLs.
      - name: Stage the publish directory
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='dist' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            ./ dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=danielospina-info
